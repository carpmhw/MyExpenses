services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        VCS_REF: "${VCS_REF:-unknown}"
    expose:
      - "5000"
    volumes:
      - myexpenses-data:/app/data
      - myexpenses-backups:/app/data/backups
      - myexpenses-dataprotection:/app/keys
    environment:
      - "ASPNETCORE_ENVIRONMENT=Production"
      - "ConnectionStrings__DefaultConnection=Data Source=/app/data/MyExpenses.db"
      - "DataProtection__ApplicationName=MyExpenses"
      - "DataProtection__KeyDirectory=/app/keys"
      - "Deployment__Mode=${MYEXPENSES_DEPLOYMENT_MODE:-Local}"
      - "Deployment__BindAddress=${MYEXPENSES_BIND_ADDRESS:-127.0.0.1}"
      - "Deployment__PublicOrigin=${MYEXPENSES_PUBLIC_ORIGIN:-http://localhost}"
      - "Deployment__SecureCookies=${MYEXPENSES_COOKIE_SECURE:-false}"
      - "Jwt__Secret=${MYEXPENSES_JWT_SECRET:?MYEXPENSES_JWT_SECRET must be provided}"
      - "Bootstrap__Secret=${MYEXPENSES_BOOTSTRAP_SECRET:-}"
      - "Auth__CookieSecure=${MYEXPENSES_COOKIE_SECURE:-false}"
      - "TZ=${TZ:-Asia/Taipei}"
      # Remote 模式必須由 operator 明確設定其中一個 trusted proxy/network entry。
      - Deployment__TrustedProxies__0
      - Deployment__TrustedNetworks__0
      - Deployment__TrustedNetworks__1=127.0.0.1/32
    healthcheck:
      test: ["CMD-SHELL", "test \"$(curl --fail --silent --show-error --max-time 4 -H 'X-Forwarded-Proto: https' -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/health/ready)\" = \"200\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # 預設只接受本機流量；LAN 或 Remote 必須由 operator 明確覆寫 bind address。
      - "${MYEXPENSES_BIND_ADDRESS:-127.0.0.1}:${MYEXPENSES_HTTP_PORT:-80}:80"
    environment:
      MYEXPENSES_DEPLOYMENT_MODE: "${MYEXPENSES_DEPLOYMENT_MODE:-Local}"
      MYEXPENSES_TRUSTED_EDGE_NETWORKS: "${MYEXPENSES_TRUSTED_EDGE_NETWORKS:-127.0.0.1/32}"
      TZ: "${TZ:-Asia/Taipei}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--header=X-Forwarded-Proto: https", "--output-document=/dev/null", "http://127.0.0.1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  myexpenses-data:
  myexpenses-backups:
  myexpenses-dataprotection:
