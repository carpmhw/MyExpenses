map "$myexpenses_trusted_edge:$http_x_forwarded_proto" $myexpenses_forwarded_proto {
    default $scheme;
    "1:http" http;
    "1:https" https;
}

map "$myexpenses_trusted_edge:$http_x_forwarded_for" $myexpenses_forwarded_for {
    default $remote_addr;
    "1:" $remote_addr;
    ~^1:.+ $http_x_forwarded_for;
}

map $myexpenses_forwarded_proto $myexpenses_hsts {
    default "";
    https "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Remote HTTPS edge 應傳遞 X-Forwarded-Proto；Local/LAN 仍可直接使用 HTTP。
    if ($myexpenses_redirect_http = 1) {
        return 301 https://$host$request_uri;
    }

    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $myexpenses_hsts always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /health/live {
        proxy_pass http://backend:5000/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $myexpenses_forwarded_for;
        proxy_set_header X-Forwarded-Proto $myexpenses_forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    location = /health/ready {
        proxy_pass http://backend:5000/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $myexpenses_forwarded_for;
        proxy_set_header X-Forwarded-Proto $myexpenses_forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $myexpenses_forwarded_for;
        proxy_set_header X-Forwarded-Proto $myexpenses_forwarded_proto;
    }
}
