name: MCP Security

on:
  pull_request:
    paths:
      - "backend/myexpenses-mcp-server/**"
      - ".github/workflows/mcp-security.yml"
  push:
    branches:
      - main
    paths:
      - "backend/myexpenses-mcp-server/**"
      - ".github/workflows/mcp-security.yml"

permissions:
  contents: read

jobs:
  mcp-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/myexpenses-mcp-server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/myexpenses-mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build and test MCP server
        run: npm test
